<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Registrarse</title>

    <style type="text/css">
        label {
            font-size: 18px;
        }

        form {
            width: 500px;
            border: 1px solid black;
        }

        input {
            margin: 7px;
            padding: 2px;
        }

        .form-label {
            margin-bottom: 0;
        }

        .txt {
            display: inline-block;
            width: 80%;
            outline: none;
            margin: 0;
        }
    </style>
</head>

<body>
     <!-- Area de encabezados fijos -->
     <!-- close the browser and start it with the --disable-web-security and --user-data-dir flags-->
    <center><img src="HelpDeskGirl.png" alt="Nuestra imagen corporativa" style="width: 200px; height: 150px;">
    <center>
        <h1>Sistema de Mesa de Ayuda</h1>
        <h2>Registrarse</h2>
    </center>

    <!-- Formulario para enviar los datos de registración -->
    <center>
        <form class="form" method="POST" style="background-color: #d8f7cf">
            <br>
           <table>
    <tr>
        <td><label for="contacto" class="form-label">Correo electrónico</label></td>
    </tr>
    <tr>
        <td>
            <input
                id="contacto"
                class="txt"
                name="contacto"
                type="email"
                placeholder="Correo electrónico"
                required
            >
        </td>
    </tr>

    <tr><td>&nbsp;</td></tr>

    <tr>
        <td><label for="nombre" class="form-label">Nombre</label></td>
    </tr>
    <tr>
        <td>
            <input
                id="nombre"
                class="txt"
                name="nombre"
                type="text"
                placeholder="Nombre"
                required
            >
        </td>
    </tr>

    <tr><td>&nbsp;</td></tr>

    <tr>
        <td><label for="password" class="form-label">Contraseña</label></td>
    </tr>
    <tr>
        <td>
            <input
                id="password"
                class="txt"
                name="password"
                type="password"
                placeholder="Contraseña"
                required
            >
        </td>
    </tr>

    <tr><td><span id="resultado1"></span></td></tr>

    <tr>
        <td>
            <input
                id="termscondition"
                name="termscondition"
                type="checkbox"
                required
            >
            <label for="termscondition">Acepto los términos y condiciones</label>
        </td>
    </tr>

    <tr><td><span id="resultado2"></span></td></tr>
</table>
<button type="submit">Registrarme</button>
<br><br>

<span>¿Ya tienes una cuenta?</span>
<a href="loginClient.html">Iniciar sesión</a>
    
    <!-- Script a ser ejecutado --> 
    <script src="registerClient.js" type="module"></script>
    

</body>
